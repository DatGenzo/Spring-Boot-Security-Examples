<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head><title>Quản lý User</title></head>
<body>
<main layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Quản lý User</h1>
        <a class="btn btn-primary" th:href="@{/users/create}">Thêm User</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form class="card card-body shadow-sm mb-3" method="get" th:action="@{/users}">
        <div class="row g-2">
            <div class="col-md-8">
                <input class="form-control" name="keyword" th:value="${keyword}"
                       placeholder="Username, email hoặc họ tên">
            </div>
            <div class="col-md-2">
                <select class="form-select" name="size">
                    <option value="5" th:selected="${size == 5}">5</option>
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="20" th:selected="${size == 20}">20</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-primary">Tìm kiếm</button>
            </div>
        </div>
    </form>

    <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th>
                    <th>Role</th><th>Trạng thái</th><th>Products</th><th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td><span class="badge text-bg-info" th:text="${user.roleName}"></span></td>
                    <td th:text="${user.enabled ? 'ACTIVE' : 'INACTIVE'}"></td>
                    <td th:text="${user.productCount}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/users/edit/{id}(id=${user.id})}">Sửa</a>
                            <form method="post" th:action="@{/users/delete/{id}(id=${user.id})}"
                                  onsubmit="return confirm('Xóa User này?');">
                                <button class="btn btn-danger btn-sm">Xóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${users.empty}"><td colspan="8" class="text-center">Không có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${users.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                th:classappend="${i == users.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/users(page=${i},size=${size},keyword=${keyword})}"></a>
            </li>
            <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">Sau</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
