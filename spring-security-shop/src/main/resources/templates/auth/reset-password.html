<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head><title>Đặt lại mật khẩu</title></head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header"><h1 class="h4 mb-0">Đặt lại mật khẩu</h1></div>
                <div class="card-body">
                    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
                    <form method="post" th:action="@{/reset-password}"
                          th:object="${resetPasswordDTO}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}" readonly>
                            <div class="text-danger" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">OTP</label>
                            <input class="form-control" th:field="*{otp}" maxlength="6">
                            <div class="text-danger" th:errors="*{otp}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input class="form-control" type="password" th:field="*{password}">
                            <div class="text-danger" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input class="form-control" type="password" th:field="*{confirmPassword}">
                            <div class="text-danger" th:errors="*{confirmPassword}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đổi mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
