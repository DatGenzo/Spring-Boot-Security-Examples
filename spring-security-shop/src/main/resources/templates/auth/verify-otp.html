<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head><title>Xác nhận OTP</title></head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header"><h1 class="h4 mb-0">Xác nhận OTP</h1></div>
                <div class="card-body">
                    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form method="post" th:action="@{/verify-otp}" th:object="${verifyOtpDTO}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="item : ${#fields.globalErrors()}" th:text="${item}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}" readonly>
                            <div class="text-danger" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">OTP 6 chữ số</label>
                            <input class="form-control" th:field="*{otp}"
                                   maxlength="6" inputmode="numeric" autofocus>
                            <div class="text-danger" th:errors="*{otp}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Xác nhận</button>
                    </form>

                    <form method="post" th:action="@{/resend-register-otp}" class="mt-2">
                        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                        <button class="btn btn-outline-secondary w-100" type="submit">Gửi lại OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
