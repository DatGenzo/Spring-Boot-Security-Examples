<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head><title>Quên mật khẩu</title></head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header"><h1 class="h4 mb-0">Quên mật khẩu</h1></div>
                <div class="card-body">
                    <form method="post" th:action="@{/forgot-password}"
                          th:object="${forgotPasswordDTO}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}">
                            <div class="text-danger" th:errors="*{email}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Gửi OTP</button>
                    </form>
                    <a class="d-block mt-3" th:href="@{/login}">Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
