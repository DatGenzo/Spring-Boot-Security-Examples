<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head><title>Đăng nhập</title></head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header"><h1 class="h4 mb-0">Đăng nhập</h1></div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${param.error}">
                        Tài khoản, mật khẩu không đúng hoặc tài khoản chưa kích hoạt.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        Đăng xuất thành công.
                    </div>
                    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username hoặc email</label>
                            <input class="form-control" id="username" name="username"
                                   required autofocus autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <input class="form-control" id="password" name="password"
                                   type="password" required autocomplete="current-password">
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    </form>

                    <div class="d-flex justify-content-between mt-3">
                        <a th:href="@{/register}">Tạo tài khoản</a>
                        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
