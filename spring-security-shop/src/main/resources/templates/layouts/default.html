<!doctype html>
<html lang="vi"

      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Security Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <link rel="stylesheet" th:href="@{/css/app.css}">

<body class="bg-light d-flex flex-column min-vh-100">

    <main class="container py-4 flex-grow-1" layout:fragment="content">
        Nội dung

    <footer class="bg-dark text-white text-center py-3">
        <div>Spring Boot Security Shop</div>
        <div class="small">Đỗ Thành Đạt | MSSV: 24110192 | Lớp: 241104A</div>
    </footer>

</html>
