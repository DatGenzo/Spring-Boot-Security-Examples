<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a
                class="navbar-brand fw-semibold"
                th:href="@{/}"
            >
                Security Custom Login
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Mở menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                id="mainNavigation"
                class="collapse navbar-collapse"
            >
                <div class="navbar-nav me-auto">
                    <a
                        class="nav-link"
                        th:href="@{/}"
                    >
                        Trang chủ
                    </a>

                    <a
                        class="nav-link"
                        sec:authorize="hasRole('ADMIN')"
                        th:href="@{/admin}"
                    >
                        Quản trị
                    </a>
                </div>

                <a
                    class="btn btn-outline-light"
                    sec:authorize="isAnonymous()"
                    th:href="@{/login}"
                >
                    Đăng nhập
                </a>

                <div
                    class="d-flex align-items-center gap-3 text-white"
                    sec:authorize="isAuthenticated()"
                >
                    <img
                        class="header-avatar"
                        th:src="${#authentication.principal.images}"
                        alt="Ảnh đại diện"
                    >

                    <div class="small lh-sm">
                        <div
                            class="fw-semibold"
                            sec:authentication="principal.fullName"
                        >
                            Họ tên
                        </div>

                        <div class="text-white-50">
                            <span
                                sec:authentication="principal.username"
                            >
                                username
                            </span>

                            <span> · </span>

                            <span
                                sec:authentication="principal.email"
                            >
                                email
                            </span>
                        </div>

                        <span
                            class="badge text-bg-info mt-1"
                            sec:authentication="principal.role"
                        >
                            ROLE
                        </span>
                    </div>

                    <form
                        method="post"
                        th:action="@{/logout}"
                    >
                        <button
                            type="submit"
                            class="btn btn-outline-light btn-sm"
                        >
                            Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
