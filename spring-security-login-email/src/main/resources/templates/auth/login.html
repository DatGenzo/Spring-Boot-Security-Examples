<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:replace="~{layouts/layout :: head('Đăng nhập bằng email')}"
  ></head>

  <body class="auth-page">
    <main class="auth-card">
      <div class="student">
        Đỗ Thành Đạt – 24110192
      </div>

      <h1>Spring Security 7</h1>
      <h2>Đăng nhập bằng email</h2>

      <div
        class="alert error"
        th:if="${param.error}"
      >
        Email hoặc mật khẩu không đúng.
      </div>

      <div
        class="alert success"
        th:if="${param.logout}"
      >
        Bạn đã đăng xuất thành công.
      </div>

      <form
        th:action="@{/login}"
        method="post"
      >
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          placeholder="admin@example.com"
          required
          autofocus
        />

        <label for="password">
          Mật khẩu
        </label>

        <input
          id="password"
          type="password"
          name="password"
          placeholder="Nhập mật khẩu"
          required
        />

        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <button
          class="btn primary full"
          type="submit"
        >
          Đăng nhập
        </button>
      </form>
    </main>
  </body>
</html>
