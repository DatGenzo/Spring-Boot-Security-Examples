<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header
      th:fragment="header"
      class="topbar"
    >
      <a
        class="brand"
        th:href="@{/}"
      >
        Security Example 1
      </a>

      <nav>
        <a th:href="@{/}">
          Trang chủ
        </a>

        <a
          sec:authorize="hasRole('ADMIN')"
          th:href="@{/admin/dashboard}"
        >
          Quản trị
        </a>
      </nav>

      <div
        class="account"
        sec:authorize="isAuthenticated()"
      >
        <span class="account-label">
          Đăng nhập bằng email:
        </span>

        <strong sec:authentication="name">
          admin@example.com
        </strong>

        <form
          th:action="@{/logout}"
          method="post"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <button
            class="link-button"
            type="submit"
          >
            Đăng xuất
          </button>
        </form>
      </div>

      <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}">
          Đăng nhập
        </a>
      </div>
    </header>
  </body>
</html>
